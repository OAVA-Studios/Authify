version: "3.9"

services:
  # ────────────────────────────────────────────
  # Authify API
  # ────────────────────────────────────────────
  authify-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
    container_name: authify-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-authify}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-authify}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      API_URL: http://authify-api:3000
      DASHBOARD_URL: http://authify-dashboard
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - authify
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ────────────────────────────────────────────
  # Authify Dashboard (React + nginx)
  # ────────────────────────────────────────────
  authify-dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
      target: production
    container_name: authify-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3001}:80"
    env_file:
      - .env
    depends_on:
      authify-api:
        condition: service_healthy
    networks:
      - authify

  # ────────────────────────────────────────────
  # Authify Worker (BullMQ)
  # ────────────────────────────────────────────
  authify-worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
    container_name: authify-worker
    restart: unless-stopped
    command: ["bun", "run", "apps/api/dist/worker.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-authify}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-authify}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - authify

  # ────────────────────────────────────────────
  # PostgreSQL 16
  # ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: authify-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-authify}
      POSTGRES_USER: ${DB_USER:-authify}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    networks:
      - authify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-authify} -d ${DB_NAME:-authify}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ────────────────────────────────────────────
  # Redis 7
  # ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: authify-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - authify
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ────────────────────────────────────────────
  # MinIO (S3-compatible Storage)
  # ────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: authify-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    networks:
      - authify
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  authify:
    driver: bridge
